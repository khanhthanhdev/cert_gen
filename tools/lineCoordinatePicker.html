<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Line Coordinate Picker - Certificate Generator</title>
    <style>
      /* Self-contained CSS - no external dependencies */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        max-width: none;
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        line-height: 1.6;
        color: #1a1a1a;
      }

      .header {
        background: #ffffff;
        color: #1a1a1a;
        padding: 24px 0;
        border-bottom: 1px solid #e5e7eb;
        margin-bottom: 0;
        text-align: center;
      }
      .header h1 {
        font-size: 2rem;
        font-weight: 600;
        margin-bottom: 8px;
        letter-spacing: -0.01em;
        color: #1a1a1a;
      }

      .header p {
        font-size: 1rem;
        color: #6b7280;
        font-weight: 400;
        margin-bottom: 0;
      }

      .header div {
        margin-top: 20px;
        display: flex;
        justify-content: center;
        gap: 12px;
      }

      .header button {
        background: #f9fafb;
        border: 1px solid #d1d5db;
        color: #374151;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
        transition: all 0.2s ease;
        font-size: 0.875rem;
      }

      .header button:hover {
        background: #f3f4f6;
        border-color: #9ca3af;
      }      .container {
        background: white;
        padding: 32px;
        margin: 0;
        display: grid;
        grid-template-columns: 350px 1fr;
        grid-template-rows: auto auto 1fr;
        grid-template-areas: 
          "sidebar preview"
          "sidebar preview"
          "sidebar preview";
        gap: 32px;
        min-height: calc(100vh - 100px);
      }

      .sidebar {
        grid-area: sidebar;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .preview-area {
        grid-area: preview;
        display: flex;
        flex-direction: column;
        gap: 20px;
        min-height: 0;
      }

      .controls {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .control-group {
        background: #ffffff;
        padding: 24px;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
      }

      .control-group h3 {
        margin: 0 0 16px 0;
        color: #1a1a1a;
        font-size: 1.125rem;
        font-weight: 600;
      }

      button {
        background: #1a1a1a;
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 6px;
        cursor: pointer;
        margin: 5px;
        transition: all 0.2s ease;
        font-size: 0.875rem;
        font-weight: 500;
      }

      button:hover {
        background: #374151;
      }

      button.active {
        background: #10b981;
      }

      button.active:hover {
        background: #059669;
      }

      button:disabled {
        background: #e5e7eb;
        color: #9ca3af;
        cursor: not-allowed;
      }

      button:disabled:hover {
        background: #e5e7eb;
      }      #pdf-canvas {
        border: 1px solid #e5e7eb;
        cursor: crosshair;
        max-width: 100%;
        max-height: calc(100vh - 200px);
        background: white;
        border-radius: 6px;
        object-fit: contain;
        width: auto;
        height: auto;
      }

      .canvas-container {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        overflow: auto;
        background: #f9fafb;
        border-radius: 8px;
        padding: 20px;
        min-height: 500px;
      }

      .status {
        background: #f9fafb;
        padding: 12px 16px;
        border-radius: 6px;
        margin: 16px 0;
        font-family: monospace;
        border-left: 3px solid #6b7280;
        font-size: 0.875rem;
      }

      .coordinates-display {
        background: #ffffff;
        padding: 16px;
        border-radius: 6px;
        margin: 8px 0;
        font-family: monospace;
        font-size: 0.875rem;
        border: 1px solid #e5e7eb;
      }      .line-preview {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        padding: 20px;
        border-radius: 8px;
        margin: 0;
      }

      .line-preview h4 {
        font-size: 1rem;
        font-weight: 600;
        color: #1a1a1a;
        margin-bottom: 16px;
      }

      input[type="file"] {
        margin: 10px 0;
        padding: 8px 12px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 0.875rem;
        background: white;
        width: 100%;
      }

      input[type="file"]:focus {
        outline: none;
        border-color: #1a1a1a;
        box-shadow: 0 0 0 3px rgba(26, 26, 26, 0.1);
      }

      .success {
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
        color: #166534;
        padding: 12px 16px;
        border-radius: 6px;
        margin: 16px 0;
        font-size: 0.875rem;
      }

      .error {
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #991b1b;
        padding: 12px 16px;
        border-radius: 6px;
        margin: 16px 0;
        font-size: 0.875rem;
      }

      .action-buttons {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 20px;
      }

      .action-buttons button {
        flex: 1;
        min-width: 120px;
      }      @media (max-width: 768px) {
        body {
          padding: 0;
        }

        .header {
          padding: 16px;
        }

        .header h1 {
          font-size: 1.5rem;
        }

        .header div {
          flex-direction: column;
          gap: 8px;
        }

        .container {
          padding: 16px;
          grid-template-columns: 1fr;
          grid-template-areas: 
            "sidebar"
            "preview";
          gap: 16px;
        }

        .sidebar {
          order: 1;
        }

        .preview-area {
          order: 2;
        }

        .controls {
          gap: 16px;
        }

        .control-group {
          padding: 16px;
        }

        .line-preview {
          padding: 16px;
        }

        .coordinates-display {
          padding: 12px;
          font-size: 0.8rem;
        }

        button {
          padding: 8px 12px;
          font-size: 0.8rem;
          margin: 3px;
        }

        #pdf-canvas {
          max-height: 60vh;
        }

        .canvas-container {
          min-height: 300px;
          padding: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Line Coordinate Picker</h1>
      <p>
        Click to set start and end points of lines where text should be
        positioned on your certificate
      </p>
      <div style="margin-top: 15px">
        <button onclick="window.open('/', '_blank')">
          Open Main Dashboard
        </button>
        <button onclick="window.location.reload()">Refresh Picker</button>
      </div>
    </div>    <div class="container">
      <div class="sidebar">
        <div class="controls">
          <div class="control-group">
            <h3>PDF Template</h3>
            <input type="file" id="pdf-upload" accept=".pdf" />
            <div id="pdf-status" class="status">
              Please upload your PDF template
            </div>
          </div>

          <div class="control-group">
            <h3>Line Selection Mode</h3>
            <button id="name-line-btn" onclick="setMode('name')">
              Set NAME Line
            </button>
            <button id="position-line-btn" onclick="setMode('position')">
              Set POSITION Line
            </button>
            <button id="clear-btn" onclick="clearLines()">Clear All Lines</button>
            <div id="mode-status" class="status">
              Click a button to start setting lines
            </div>
          </div>

          <div class="line-preview" id="coordinates-preview">
            <h4>Current Coordinates</h4>
            <div id="name-coordinates" class="coordinates-display">
              <strong>NAME Line:</strong> Not set
            </div>
            <div id="position-coordinates" class="coordinates-display">
              <strong>POSITION Line:</strong> Not set
            </div>
          </div>

          <div class="action-buttons">
            <button id="save-config-btn" onclick="saveToConfig()" disabled>
              Save to Config
            </button>
            <button id="test-lines-btn" onclick="testLines()" disabled>
              Test Lines
            </button>
          </div>

          <div id="result-status"></div>
        </div>
      </div>

      <div class="preview-area">
        <div class="canvas-container">
          <canvas id="pdf-canvas"></canvas>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <script>
      // Set the workerSrc for pdf.js
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.worker.min.js";

      let canvas = document.getElementById("pdf-canvas");
      let ctx = canvas.getContext("2d");
      let pdfPage = null;
      let currentMode = null;
      let lines = {
        name: { start: null, end: null },
        position: { start: null, end: null },
      };
      let pendingPoint = null; // For storing the first point while waiting for second

      // UI elements
      const pdfUpload = document.getElementById("pdf-upload");
      const pdfStatus = document.getElementById("pdf-status");
      const modeStatus = document.getElementById("mode-status");
      const nameCoords = document.getElementById("name-coordinates");
      const positionCoords = document.getElementById("position-coordinates");
      const resultStatus = document.getElementById("result-status");
      const saveBtn = document.getElementById("save-config-btn");
      const testBtn = document.getElementById("test-lines-btn");

      // Load PDF
      pdfUpload.addEventListener("change", async (event) => {
        const file = event.target.files[0];
        if (file && file.type === "application/pdf") {
          try {
            pdfStatus.textContent = "Loading PDF...";
            const arrayBuffer = await file.arrayBuffer();
            const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer })
              .promise;
            pdfPage = await pdfDoc.getPage(1);

            const viewport = pdfPage.getViewport({ scale: 1 });
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            const renderContext = {
              canvasContext: ctx,
              viewport: viewport,
            };
            await pdfPage.render(renderContext).promise;
            pdfStatus.textContent =
              "PDF loaded (" + canvas.width + "x" + canvas.height + ")";
            pdfStatus.className = "status success";
          } catch (err) {
            pdfStatus.textContent = "Error loading PDF: " + err.message;
            pdfStatus.className = "status error";
            pdfPage = null;
          }
        }
      });

      // Set mode for line selection
      function setMode(mode) {
        currentMode = mode;
        pendingPoint = null;

        // Update button states
        document
          .getElementById("name-line-btn")
          .classList.toggle("active", mode === "name");
        document
          .getElementById("position-line-btn")
          .classList.toggle("active", mode === "position");
        modeStatus.textContent =
          mode.toUpperCase() + " line mode: Click start point, then end point";
        modeStatus.className = "status";
      }

      // Clear all lines
      function clearLines() {
        lines = {
          name: { start: null, end: null },
          position: { start: null, end: null },
        };
        pendingPoint = null;
        currentMode = null;

        // Reset button states
        document.getElementById("name-line-btn").classList.remove("active");
        document.getElementById("position-line-btn").classList.remove("active");

        updateDisplay();
        redrawCanvas();

        modeStatus.textContent = "Cleared all lines. Select a mode to start.";
        modeStatus.className = "status";
      }

      // Handle canvas clicks
      canvas.addEventListener("click", (event) => {
        if (!pdfPage || !currentMode) {
          modeStatus.textContent =
            "Please load a PDF and select a line mode first";
          modeStatus.className = "status error";
          return;
        }

        const rect = canvas.getBoundingClientRect();
        const canvasX = event.clientX - rect.left;
        const canvasY = event.clientY - rect.top;

        // Convert to PDF coordinates
        const scaleX = pdfPage.getViewport({ scale: 1 }).width / canvas.width;
        const scaleY = pdfPage.getViewport({ scale: 1 }).height / canvas.height;
        const pdfX = canvasX * scaleX;
        const pdfY =
          pdfPage.getViewport({ scale: 1 }).height - canvasY * scaleY;

        const point = { x: pdfX, y: pdfY, canvasX, canvasY };

        if (!pendingPoint) {
          // First point (start)
          pendingPoint = point;
          modeStatus.textContent =
            "Start point set (" +
            pdfX.toFixed(1) +
            ", " +
            pdfY.toFixed(1) +
            "). Click end point.";
          modeStatus.className = "status";
        } else {
          // Second point (end)
          lines[currentMode] = {
            start: pendingPoint,
            end: point,
          };
          modeStatus.textContent =
            currentMode.toUpperCase() +
            " line complete! Select another mode or save config.";
          modeStatus.className = "status success";

          pendingPoint = null;
          currentMode = null;

          // Reset button states
          document.getElementById("name-line-btn").classList.remove("active");
          document
            .getElementById("position-line-btn")
            .classList.remove("active");
        }

        updateDisplay();
        redrawCanvas();
      });

      // Update coordinate display
      function updateDisplay() {
        // Name line
        if (lines.name.start && lines.name.end) {
          const start = lines.name.start;
          const end = lines.name.end;
          nameCoords.innerHTML = `
                          <strong>NAME Line:</strong><br>
                          Start: (${start.x.toFixed(1)}, ${start.y.toFixed(
            1
          )})<br>
                          End: (${end.x.toFixed(1)}, ${end.y.toFixed(1)})<br>
                          Width: ${Math.abs(end.x - start.x).toFixed(1)}
                      `;
        } else {
          nameCoords.innerHTML = "<strong>NAME Line:</strong> Not set";
        }

        // Position line
        if (lines.position.start && lines.position.end) {
          const start = lines.position.start;
          const end = lines.position.end;
          positionCoords.innerHTML = `
                          <strong>POSITION Line:</strong><br>
                          Start: (${start.x.toFixed(1)}, ${start.y.toFixed(
            1
          )})<br>
                          End: (${end.x.toFixed(1)}, ${end.y.toFixed(1)})<br>
                          Width: ${Math.abs(end.x - start.x).toFixed(1)}
                      `;
        } else {
          positionCoords.innerHTML = "<strong>POSITION Line:</strong> Not set";
        }

        // Enable/disable buttons
        const hasLines =
          (lines.name.start && lines.name.end) ||
          (lines.position.start && lines.position.end);
        saveBtn.disabled = !hasLines;
        testBtn.disabled = !hasLines;
      }

      // Redraw canvas with lines
      function redrawCanvas() {
        if (!pdfPage) return;

        // Re-render PDF
        const viewport = pdfPage.getViewport({ scale: 1 });
        const renderContext = {
          canvasContext: ctx,
          viewport: viewport,
        };
        pdfPage.render(renderContext);

        // Draw lines
        setTimeout(() => {
          // Wait for PDF render
          drawLines();
        }, 100);
      }

      // Draw lines on canvas
      function drawLines() {
        const scaleX = canvas.width / pdfPage.getViewport({ scale: 1 }).width;
        const scaleY = canvas.height / pdfPage.getViewport({ scale: 1 }).height;

        // Draw name line
        if (lines.name.start && lines.name.end) {
          drawLine(
            lines.name.start,
            lines.name.end,
            "#007bff",
            "NAME",
            scaleX,
            scaleY
          );
        }

        // Draw position line
        if (lines.position.start && lines.position.end) {
          drawLine(
            lines.position.start,
            lines.position.end,
            "#28a745",
            "POSITION",
            scaleX,
            scaleY
          );
        }

        // Draw pending point
        if (pendingPoint) {
          ctx.fillStyle = "#dc3545";
          ctx.beginPath();
          ctx.arc(
            pendingPoint.canvasX,
            pendingPoint.canvasY,
            5,
            0,
            2 * Math.PI
          );
          ctx.fill();
        }
      }

      // Draw a single line
      function drawLine(start, end, color, label, scaleX, scaleY) {
        const startCanvasX = start.canvasX;
        const startCanvasY = start.canvasY;
        const endCanvasX = end.canvasX;
        const endCanvasY = end.canvasY;

        // Draw line
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(startCanvasX, startCanvasY);
        ctx.lineTo(endCanvasX, endCanvasY);
        ctx.stroke();

        // Draw endpoints
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(startCanvasX, startCanvasY, 6, 0, 2 * Math.PI);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(endCanvasX, endCanvasY, 6, 0, 2 * Math.PI);
        ctx.fill();

        // Draw label
        ctx.fillStyle = color;
        ctx.font = "14px Arial";
        const labelX = (startCanvasX + endCanvasX) / 2;
        const labelY = (startCanvasY + endCanvasY) / 2 - 10;
        ctx.fillText(label, labelX - 20, labelY);
      } // Save to config
      async function saveToConfig() {
        try {
          const config = generateConfig();

          // Validate config has at least one field
          if (
            !config.textFields ||
            Object.keys(config.textFields).length === 0
          ) {
            resultStatus.innerHTML = `
                              <div class="error">
                                  <h4>No Configuration to Save</h4>
                                  <p>Please draw at least one line (NAME or POSITION) before saving.</p>
                              </div>
                          `;
            return;
          }

          // Try to save to server first
          try {
            const response = await fetch(
              "http://localhost:3000/api/save-config",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify(config),
              }
            );
            if (response.ok) {
              const result = await response.json();
              const savedFields = result.config?.textFields
                ? Object.keys(result.config.textFields)
                : Object.keys(config.textFields || {});
              resultStatus.innerHTML = `
                                  <div class="success">
                                      <h4>Configuration Saved Successfully!</h4>
                                      <p>Updated fields: ${savedFields.join(
                                        ", "
                                      )}</p>
                                      <p>The configuration has been saved to config.json</p>
                                      <p>You can now run: <code>npm run generate</code> or <code>node index.js</code></p>
                                  </div>
                              `;
              return;
            } else {
              throw new Error(
                `Server responded with status ${response.status}`
              );
            }          } catch (serverError) {
            console.log("Server not available:", serverError.message);
          }

          // Fallback to manual download
          resultStatus.innerHTML = `
            <div class="success">
              <h4>Configuration Generated!</h4>
              <p>
                <strong>Server not running:</strong> Start the server first:
              </p>
              <pre style="background: #f8f9fa; padding: 10px; border-radius: 5px; margin: 10px 0;">
cd tools
node coordinateServer.js
# OR use npm script:
npm run coordinate-picker</pre>
              <p>Then refresh this page and try saving again.</p>
              <p>
                <strong>Alternative:</strong> Manually copy this configuration to
                your config.json file:
              </p>
              <textarea style="width: 100%; height: 200px; font-family: monospace; margin: 10px 0;">${JSON.stringify(config, null, 2)}</textarea>
              <button onclick="downloadConfig()">
                Download config-update.json
              </button>
            </div>
          `;

          // Store config for download
          window.generatedConfig = config;
        } catch (error) {
          resultStatus.innerHTML = `
                          <div class="error">
                              <h4>Error generating configuration</h4>
                              <p>${error.message}</p>
                          </div>
                      `;
        }
      }

      // Generate configuration object
      function generateConfig() {
        const config = {
          textFields: {},
        };

        if (lines.name.start && lines.name.end) {
          config.textFields.name = {
            coordinates: {
              lineStartX: Math.min(lines.name.start.x, lines.name.end.x),
              lineEndX: Math.max(lines.name.start.x, lines.name.end.x),
              yFromTop:
                pdfPage.getViewport({ scale: 1 }).height -
                Math.max(lines.name.start.y, lines.name.end.y),
              coordinateSystem: "line",
            },
            formatting: {
              preserveAcronyms: true,
              wordSpacing: "   ",
              capitalizeWords: true,
            },
            offset: 0,
            additionalVerticalLift: 0,
          };
        }

        if (lines.position.start && lines.position.end) {
          config.textFields.position = {
            coordinates: {
              lineStartX: Math.min(
                lines.position.start.x,
                lines.position.end.x
              ),
              lineEndX: Math.max(lines.position.start.x, lines.position.end.x),
              yFromTop:
                pdfPage.getViewport({ scale: 1 }).height -
                Math.max(lines.position.start.y, lines.position.end.y),
              coordinateSystem: "line",
            },
            formatting: {
              preserveAcronyms: true,
              wordSpacing: " ",
              capitalizeWords: true,
            },
            offset: 0,
            additionalVerticalLift:0,
          };
        }

        return config;
      } // Download config file
      function downloadConfig() {
        if (!window.generatedConfig) return;

        const blob = new Blob(
          [JSON.stringify(window.generatedConfig, null, 2)],
          { type: "application/json" }
        );
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "config-update.json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } // Test lines
      async function testLines() {
        try {
          const config = generateConfig();

          const response = await fetch("http://localhost:3000/api/test-lines", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(config),
          });

          if (response.ok) {
            const result = await response.json();
            resultStatus.innerHTML = `
                              <div class="success">
                                  <h4>Test Lines</h4>
                                  <p>${result.message}</p>
                                  <p><strong>Note:</strong> ${result.note}</p>
                              </div>
                          `;
          } else {
            throw new Error(`Server responded with status ${response.status}`);
          }
        } catch (error) {
          resultStatus.innerHTML = `
                          <div class="success">
                              <h4>Test Lines</h4>
                              <p><strong>Server not available.</strong> To test your lines:</p>
                              <ol>
                                  <li>Start the server: <code>npm run coordinate-picker</code></li>
                                  <li>Save your configuration first</li>
                                  <li>Or manually run: <code>npm run generate</code></li>
                                  <li>Check the generated certificates in output/participants/</li>
                              </ol>
                          </div>
                      `;
        }
      }

      // Initialize
      updateDisplay();
    </script>
  </body>
</html>
