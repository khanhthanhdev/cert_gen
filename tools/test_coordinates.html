<!DOCTYPE html>
<html>
<head>
    <title>Test PDF Coordinate Picker</title>
    <style>
        #pdf-canvas {
            border: 1px solid black;
            cursor: crosshair;
        }
        #coords-display {
            margin-top: 10px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>PDF Coordinate Picker Test</h1>
    <input type="file" id="pdf-upload" accept=".pdf">
    <div id="coords-display">Click on the PDF to see coordinates.</div>
    <canvas id="pdf-canvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <script>
        // Set the workerSrc for pdf.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.worker.min.js';

        const pdfUpload = document.getElementById('pdf-upload');
        const canvas = document.getElementById('pdf-canvas');
        const ctx = canvas.getContext('2d');
        const coordsDisplay = document.getElementById('coords-display');
        let currentPdfPath = null; // Will store the file path from Electron
        let currentPdfFile = null; // Will store the File object
        let pdfPage = null;
        let pdfScale = 1; // For simplicity, render at original size initially

        pdfUpload.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (file && file.type === 'application/pdf') {
                currentPdfFile = file; // Store the file object
                // For Electron, file.path would give the full system path.
                // If running in a plain browser, file.path is not available.
                // We'll rely on window.electronAPI to pass the path later if needed.
                currentPdfPath = file.path || 'local_browser_file';


                coordsDisplay.textContent = 'Loading PDF...';
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    pdfPage = await pdfDoc.getPage(1); // Get the first page

                    const viewport = pdfPage.getViewport({ scale: pdfScale });
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    const renderContext = {
                        canvasContext: ctx,
                        viewport: viewport
                    };
                    await pdfPage.render(renderContext).promise;
                    coordsDisplay.textContent = 'PDF loaded. Click on the PDF.';
                } catch (err) {
                    console.error('Error loading or rendering PDF:', err);
                    coordsDisplay.textContent = 'Error loading PDF: ' + err.message;
                    currentPdfPath = null;
                    currentPdfFile = null;
                    pdfPage = null;
                }
            } else {
                coordsDisplay.textContent = 'Please select a PDF file.';
                currentPdfPath = null;
                currentPdfFile = null;
                pdfPage = null;
            }
        });

        canvas.addEventListener('click', async (event) => {
            if (!pdfPage) { // Check pdfPage instead of currentPdfPath for loaded state
                coordsDisplay.textContent = 'Please load a PDF first.';
                return;
            }

            const rect = canvas.getBoundingClientRect();
            const canvasX = event.clientX - rect.left;
            const canvasY = event.clientY - rect.top;

            const pdfOriginalWidth = pdfPage.getViewport({ scale: 1 }).width;
            const pdfOriginalHeight = pdfPage.getViewport({ scale: 1 }).height;

            // Calculate PDF coordinates based on the original size of the PDF page
            // and how it's scaled to fit the canvas.
            const scaleX = pdfOriginalWidth / canvas.width;
            const scaleY = pdfOriginalHeight / canvas.height;

            const pdfX = canvasX * scaleX;
            // Y is inverted: canvas (0,0) is top-left, PDF (0,0) is bottom-left
            const pdfY = pdfOriginalHeight - (canvasY * scaleY);


            coordsDisplay.textContent = `Clicked Canvas Coords: (X: ${canvasX.toFixed(2)}, Y: ${canvasY.toFixed(2)}) ==> PDF Coords: (X: ${pdfX.toFixed(2)}, Y: ${pdfY.toFixed(2)})`;

            // Ensure currentPdfPath is set if in Electron
            // For the testTextPlacement, we need the actual file path.
            // In Electron, file.path is available.
            const actualPdfPathForMain = currentPdfFile ? currentPdfFile.path : null;

            if (!actualPdfPathForMain && window.electronAPI) {
                 // Try to get it if it wasn't set (e.g. if not running in electron initially)
                 // This part is a bit tricky as the file object from a browser doesn't have .path
                 // For a robust solution in Electron, ensure file.path is captured from the input.
                 // The 'upload-template' IPC call in your actual app should handle getting the path.
                 console.warn("Could not determine the original PDF path for main process. Ensure file.path is available.");
                 // For this test, we might need to re-select or have a fixed path if not in Electron.
            }


            if (window.electronAPI && window.electronAPI.testTextPlacement && actualPdfPathForMain) {
                try {
                    coordsDisplay.textContent += ' | Sending to main...';
                    const resultPath = await window.electronAPI.testTextPlacement({
                        originalPdfPath: actualPdfPathForMain, // Use the actual path
                        x: pdfX,
                        y: pdfY,
                        text: 'Test @ ' + new Date().toLocaleTimeString()
                    });
                    coordsDisplay.textContent = `PDF Coords: (X: ${pdfX.toFixed(2)}, Y: ${pdfY.toFixed(2)}). Test PDF generated: ${resultPath}`;
                    alert(`Test PDF generated at: ${resultPath}`);
                } catch (error) {
                    console.error('Error calling testTextPlacement:', error);
                    coordsDisplay.textContent = 'Error generating test PDF: ' + error.message;
                }
            } else if (!window.electronAPI || !window.electronAPI.testTextPlacement) {
                coordsDisplay.textContent += ' | electronAPI.testTextPlacement not found. Check preload script.';
            } else if (!actualPdfPathForMain) {
                 coordsDisplay.textContent += ' | Original PDF path not available for main process.';
            }
        });
    </script>
</body>
</html>
